apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: homelab-workloads
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/jakubswi/homelab
        revision: main
        directories:
          - path: platform/*
          - path: apps/*
  template:
    metadata:
      name: '{{path.basename}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/jakubswi/homelab
        targetRevision: main
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
