kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      additionalScrapeConfigs:
        - job_name: 'cloudflared'
          kubernetes_sd_configs:
            - role: pod
              namespaces:
                names: ['cloudflared']
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_label_app]
              action: keep
              regex: cloudflared
            - source_labels: [__meta_kubernetes_pod_ip]
              target_label: __address__
              replacement: $1:2000

  grafana:
    envFromSecret: "grafana-oidc-secret"
    admin:
      existingSecret: "grafana-admin-credentials"
      userKey: admin-user
      passwordKey: admin-password
    grafana.ini:
      server:
        root_url: https://grafana.jakubswi.dev
      auth.generic_oauth:
        enabled: true
        name: Authentik
        allow_sign_up: true
        client_id: "9DjIRiXvEcIh8RTOI2oQ2FfxIfUkJZsVX8dsqdcy"
        scopes: openid email profile groups
        auth_url: https://auth.jakubswi.dev/application/o/authorize/
        token_url: https://auth.jakubswi.dev/application/o/token/
        api_url: https://auth.jakubswi.dev/application/o/userinfo/
        role_attribute_path: contains(groups[*], 'homelab-admins') && 'Admin' || 'Viewer'
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        searchNamespace: ALL
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: 'homelab-services'
            orgId: 1
            folder: 'Homelab Services'
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/homelab-services
    dashboards:
      homelab-services:
        traefik:
          gnetId: 17346
          revision: 9
          datasource: Prometheus
        cert-manager:
          gnetId: 20842
          revision: 3
          datasource: Prometheus
        external-secrets:
          gnetId: 19933
          revision: 1
          datasource: Prometheus
        node-exporter:
          gnetId: 1860
          revision: 37
          datasource: Prometheus
        loki-logs:
          gnetId: 13639
          revision: 2
          datasource: Loki
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
        traefik.ingress.kubernetes.io/router.middlewares: traefik-lan-only@kubernetescrd,traefik-security-headers@kubernetescrd
      hosts:
        - grafana.jakubswi.dev
      path: /
    additionalDataSources:
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://monitoring-loki:3100
        jsonData:
          maxLines: 1000
          derivedFields:
            - datasourceUid: tempo
              matcherRegex: '"trace_id":"(\w+)"'
              name: TraceID
              url: '$${__value.raw}'
      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: http://monitoring-tempo:3100
        jsonData:
          httpMethod: GET
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: '-1h'
            spanEndTimeShift: '1h'
            filterByTraceID: true
            filterBySpanID: false
          serviceMap:
            datasourceUid: Prometheus
          nodeGraph:
            enabled: true
loki:
  deploymentMode: SingleBinary
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    limits_config:
      retention_period: 168h # 7 days
    compactor:
      working_directory: /var/loki/compactor
      compaction_interval: 10m
      retention_enabled: true
      delete_request_store: filesystem

  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      storageClass: local-path
      size: 10Gi
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 768Mi

  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0
  ingester:
    replicas: 0
  querier:
    replicas: 0
  queryFrontend:
    replicas: 0
  queryScheduler:
    replicas: 0
  distributor:
    replicas: 0
  compactor:
    replicas: 0
  indexGateway:
    replicas: 0
  bloomCompactor:
    replicas: 0
  bloomGateway:
    replicas: 0
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  gateway:
    enabled: false
  test:
    enabled: false
  monitoring:
    selfMonitoring:
      enabled: false
      grafanaAgent:
        installOperator: false

tempo:
  replicas: 1
  tempo:
    retention: 72h # 3 days
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:4318"
    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
        wal:
          path: /var/tempo/wal
    metricsGenerator:
      enabled: true
      remoteWriteUrl: "http://monitoring-kube-prometheus-prometheus:9090/api/v1/write"
  persistence:
    enabled: true
    storageClassName: local-path
    size: 5Gi
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 512Mi
  serviceMonitor:
    enabled: true

alloy:
  controller:
    type: daemonset
  alloy:
    resources:
      requests:
        cpu: 25m
        memory: 96Mi
      limits:
        cpu: 250m
        memory: 256Mi
    mounts:
      varlog: true
      dockercontainers: false
    serviceMonitor:
      enabled: true
    configMap:
      content: |
        // Discover all Kubernetes pods on the node
        discovery.kubernetes "pods" {
          role = "pod"
          selectors {
            role  = "pod"
            field = "spec.nodeName=" + coalesce(sys.env("HOSTNAME"), constants.hostname)
          }
        }

        // Extract namespace, pod, and container labels
        discovery.relabel "pod_logs" {
          targets = discovery.kubernetes.pods.targets

          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_label_app"]
            separator     = ";"
            regex         = "^;*([^;]+);*.*"
            target_label  = "app"
          }
        }

        // Tail pod logs directly via Kubernetes API / CRI logs
        loki.source.kubernetes "pods" {
          targets    = discovery.relabel.pod_logs.output
          forward_to = [loki.write.default.receiver]
        }

        loki.write "default" {
          endpoint {
            url = "http://monitoring-loki:3100/loki/api/v1/push"
          }
        }
