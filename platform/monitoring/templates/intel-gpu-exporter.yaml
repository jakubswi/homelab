apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: intel-gpu-exporter
  namespace: monitoring
  labels:
    app: intel-gpu-exporter
spec:
  selector:
    matchLabels:
      app: intel-gpu-exporter
  template:
    metadata:
      labels:
        app: intel-gpu-exporter
      hostNetwork: true
    spec:
      containers:
        - name: intel-gpu-exporter
          image: ghcr.io/intel/intel-gpu-exporter:latest
          securityContext:
            privileged: true
          ports:
            - containerPort: 8080
              name: metrics
          volumeMounts:
            - name: dev-dri
              mountPath: /dev/dri
      volumes:
        - name: dev-dri
          hostPath:
            path: /dev/dri
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: intel-gpu-exporter
  namespace: monitoring
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: intel-gpu-exporter
  endpoints:
    - port: metrics
      interval: 15s
