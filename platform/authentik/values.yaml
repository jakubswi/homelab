authentik:
  global:
    deploymentStrategy:
      type: Recreate
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault

  authentik:
    secret_key: ""
    postgresql:
      host: "{{ .Release.Name }}-postgresql"
      name: "authentik"
      user: "authentik"
      password: ""

  server:
    replicas: 1
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      capabilities:
        drop:
          - ALL
    envFrom:
      - secretRef:
          name: authentik-secrets
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
        traefik.ingress.kubernetes.io/router.middlewares: traefik-rate-limit@kubernetescrd,traefik-security-headers@kubernetescrd
      hosts:
        - auth.jakubswi.dev
      paths:
        - /
      pathType: Prefix
      tls: [ ]
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1536Mi

  worker:
    replicas: 1
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      capabilities:
        drop:
          - ALL
    envFrom:
      - secretRef:
          name: authentik-secrets
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1536Mi

  postgresql:
    enabled: true
    auth:
      username: authentik
      database: authentik
      existingSecret: authentik-secrets
      secretKeys:
        adminPasswordKey: AUTHENTIK_POSTGRESQL__PASSWORD
        userPasswordKey: AUTHENTIK_POSTGRESQL__PASSWORD
    primary:
      podSecurityContext:
        enabled: true
        fsGroup: 999
        appArmorProfile:
          type: Unconfined
        seccompProfile:
          type: RuntimeDefault
      containerSecurityContext:
        enabled: true
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
          add:
            - KILL
      persistence:
        enabled: true
        storageClass: "-"
        accessModes:
          - ReadWriteOnce
        size: 10Gi
      resources:
        requests:
          cpu: 50m
          memory: 192Mi
        limits:
          cpu: 500m
          memory: 512Mi
