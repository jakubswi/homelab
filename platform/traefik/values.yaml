traefik:
  service:
    spec:
      loadBalancerIP: 192.168.0.240
      externalTrafficPolicy: Local

  ports:
    web:
      redirectTo:
        port: websecure
    websecure:
      tls:
        enabled: true
      middlewares:
        - traefik-security-headers@kubernetescrd

  tlsStore:
    default:
      defaultCertificate:
        secretName: wildcard-jakubswi-tls

  metrics:
    prometheus:
      service:
        enabled: true
      serviceMonitor:
        enabled: true

  additionalArguments:
    - "--providers.kubernetesingress.ingressendpoint.publishedservice=traefik/traefik"
    - "--providers.kubernetescrd.allowCrossNamespace=true"
    - "--entrypoints.websecure.forwardedHeaders.trustedIPs=10.42.0.0/16,192.168.0.0/24"
