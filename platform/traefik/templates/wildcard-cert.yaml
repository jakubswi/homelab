apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-jakubswi-tls
  namespace: traefik
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretName: wildcard-jakubswi-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "jakubswi.dev"
    - "*.jakubswi.dev"
