name: GitOps CI & Security Scan

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  lint-and-validate:
    name: Validate Helm & K8s Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run yamllint
        run: |
          pip install yamllint
          yamllint .

      - name: Install Helm & kubeconform
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin kubeconform

      - name: Render Charts & Validate Schemas
        run: bash scripts/validate.sh

      - name: Run Trivy Misconfiguration Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
