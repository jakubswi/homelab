ingress:
  host: wrapped.jakubswi.dev

frontend:
  replicas: 1
  image:
    repository: ghcr.io/jakubswi/spotify-wrapped-game-frontend
    tag: latest
    pullPolicy: IfNotPresent

backend:
  replicas: 1
  image:
    repository: ghcr.io/jakubswi/spotify-wrapped-game-backend
    tag: latest
    pullPolicy: IfNotPresent

secrets:
  awsSecretClientIdKey: SPOTIFY_CLIENT_ID
  awsSecretClientSecretKey: SPOTIFY_CLIENT_SECRET
