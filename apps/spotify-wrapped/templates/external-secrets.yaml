apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: spotify-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secrets-manager
    kind: ClusterSecretStore
  target:
    name: spotify-secrets
    creationPolicy: Owner
  data:
    - secretKey: CLIENT_ID
      remoteRef:
        key: SPOTIFY_API_CLIENT_ID
    - secretKey: CLIENT_SECRET
      remoteRef:
        key: SPOTIFY_API_CLIENT_SECRET
