jellyfin:
  replicaCount: 1

  image:
    pullPolicy: IfNotPresent

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    supplementalGroups:
      - 44
      - 991
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL

  jellyfin:
    env:
      - name: HOME
        value: /tmp
      - name: XDG_CACHE_HOME
        value: /cache
      - name: DOTNET_EnableCrashReport
        value: "1"
      - name: DOTNET_CreateDumpVerboseDiagnostics
        value: "1"
      - name: DOTNET_DbgEnableMiniDump
        value: "1"
      - name: DOTNET_DbgMiniDumpType
        value: "2"
      - name: DOTNET_DbgMiniDumpName
        value: "/tmp/jellyfin-crash-%p.dmp"
      - name: DOTNET_ReadyToRun
        value: "0"
      - name: DOTNET_TieredCompilation
        value: "0"

  persistence:
    config:
      enabled: true
      size: 10Gi
      storageClass: 'local-path'
    media:
      enabled: false

  ingress:
    enabled: true
    className: 'traefik'
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    hosts:
      - host: jellyfin.jakubswi.dev
        paths:
          - path: /
            pathType: Prefix

  volumes:
    - name: dri
      hostPath:
        path: /dev/dri
    - name: tmp
      emptyDir: {}
    - name: media
      hostPath:
        path: /mnt/media
        type: DirectoryOrCreate

  volumeMounts:
    - name: dri
      mountPath: /dev/dri
    - name: tmp
      mountPath: /tmp
    - name: media
      mountPath: /media

  resources:
    requests:
      cpu: 500m
      memory: 2Gi

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
