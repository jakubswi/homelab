jellyfin:
  replicaCount: 1

  image:
    pullPolicy: IfNotPresent

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    supplementalGroups:
      - 44
      - 991
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  jellyfin:
    env:
      - name: HOME
        value: /tmp
      - name: XDG_CACHE_HOME
        value: /cache

  persistence:
    config:
      enabled: true
      size: 10Gi
      storageClass: 'local-path'
    media:
      enabled: true
      size: 450Gi
      storageClass: 'local-path'

  ingress:
    enabled: true
    className: 'traefik'
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    hosts:
      - host: jellyfin.jakubswi.dev
        paths:
          - path: /
            pathType: Prefix

  volumes:
    - name: dri
      hostPath:
        path: /dev/dri
    - name: tmp
      emptyDir: {}

  volumeMounts:
    - name: dri
      mountPath: /dev/dri
    - name: tmp
      mountPath: /tmp

  resources:
    requests:
      cpu: 500m
      memory: 2Gi

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
