jellyfin:
  replicaCount: 1

  image:
    repository: jellyfin/jellyfin
    tag: "10.10.7"
    pullPolicy: IfNotPresent

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    supplementalGroups:
      - 44
      - 991
    seccompProfile:
      type: RuntimeDefault
    appArmorProfile:
      type: Unconfined

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL

  jellyfin:
    env:
      - name: HOME
        value: /tmp
      - name: XDG_CACHE_HOME
        value: /cache

  persistence:
    config:
      enabled: true
      size: 10Gi
      storageClass: 'local-path'
    media:
      enabled: true
      type: hostPath
      hostPath: /mnt/media
      readOnly: false

  ingress:
    enabled: true
    className: 'traefik'
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    hosts:
      - host: jellyfin.jakubswi.dev
        paths:
          - path: /
            pathType: Prefix

  volumes:
    - name: tmp
      emptyDir: {}

  volumeMounts:
    - name: tmp
      mountPath: /tmp

  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      gpu.intel.com/i915: "1"

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
