jellyfin:
  replicaCount: 1

  image:
    pullPolicy: IfNotPresent

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    supplementalGroups:
      - 44
      - 109
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  persistence:
    config:
      enabled: true
      size: 15Gi
      storageClass: 'local-path'
    media:
      enabled: true
      size: 400Gi
      storageClass: 'local-path'

  ingress:
    enabled: true
    className: 'traefik'
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      traefik.ingress.kubernetes.io/router.middlewares: traefik-rate-limit@kubernetescrd,traefik-security-headers@kubernetescrd
    hosts:
      - host: jellyfin.jakubswi.dev
        paths:
          - path: /
            pathType: Prefix

  extraVolumes:
    - name: dri
      hostPath:
        path: /dev/dri

  extraVolumeMounts:
    - name: dri
      mountPath: /dev/dri

  resources:
    requests:
      cpu: 500m
      memory: 1Gi

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
