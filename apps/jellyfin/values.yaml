jellyfin:
  replicaCount: 1

  image:
    pullPolicy: IfNotPresent

  persistence:
    config:
      enabled: true
      size: 5Gi
      storageClass: 'local-path'
    media:
      enabled: true
      size: 200Gi
      storageClass: 'local-path'

  ingress:
    enabled: true
    className: 'traefik'
    hosts:
      - host: jellyfin.homelab.local
        paths:
          - path: /
            pathType: Prefix
      - paths:
          - path: /
            pathType: Prefix

  extraVolumes:
    - name: dri
      hostPath:
        path: /dev/dri

  extraVolumeMounts:
    - name: dri
      mountPath: /dev/dri

  resources:
    requests:
      cpu: 500m
      memory: 1Gi

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
