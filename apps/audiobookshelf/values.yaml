image:
  repository: ghcr.io/advplyr/audiobookshelf
  tag: "2.38.0"
  pullPolicy: IfNotPresent

ingress:
  host: audiobooks.jakubswi.dev

storage:
  appDataHostPath: /mnt/audiobookshelf
  mediaHostPath: /mnt/media

resources:
  requests:
    cpu: 100m
    memory: 256Mi
    ephemeral-storage: 128Mi
  limits:
    cpu: 1000m
    memory: 1Gi
    ephemeral-storage: 512Mi
